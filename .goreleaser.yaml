# Builds release binaries and checksums. The container image is built separately by the
# release workflow, from the Dockerfile. Check locally with: make snapshot
version: 2
project_name: replaydiff

builds:
  - id: replaydiff
    main: ./cmd/replaydiff
    binary: replaydiff
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X github.com/Bispulm/replaydiff/internal/cli.Version={{ .Version }}"]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md, CHANGELOG.md, docs/**/*, examples/**/*]

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

# Release notes come from CHANGELOG.md.
changelog:
  disable: true

release:
  draft: true
