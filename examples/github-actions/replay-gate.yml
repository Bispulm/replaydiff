# Blocks a pull request if replaying recorded traffic finds a regression.
# Copy this to .github/workflows/ and adapt the steps marked below. See docs/ci.md.
name: replay-gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Install replaydiff
        run: go install github.com/Bispulm/replaydiff/cmd/replaydiff@latest

      # Adapt this: start two baselines from the last release, and the candidate from this
      # pull request, all with comparable data. This tool doesn't set up their data.
      - name: Start targets
        run: ./ci/start-targets.sh

      # This keeps going on failure, because the gate decides the outcome. If it failed before
      # writing a report, the gate finds no file and exits 2.
      - name: Replay
        continue-on-error: true
        run: |
          replaydiff run \
            --traffic ci/traffic \
            --redact ci/redact.yaml \
            --report report.json \
            --baseline-a http://127.0.0.1:8081 \
            --baseline-b http://127.0.0.1:8082 \
            --candidate http://127.0.0.1:8083 \
            --allow-origin http://127.0.0.1:8081 \
            --allow-origin http://127.0.0.1:8082 \
            --allow-origin http://127.0.0.1:8083

      # Exit code 0 passes. 1 is a regression, and 2 means the evidence can't support a
      # conclusion. Either of the last two fails this job.
      - name: Gate
        run: |
          replaydiff report report.json \
            --policy ci/policy.yaml \
            --markdown summary.md \
            --junit junit.xml \
            --json gate.json

      - name: Publish the summary
        if: always()
        run: |
          if [ -f summary.md ]; then
            cat summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "replaydiff produced no summary." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Reports hold sanitized evidence, but redaction only covers what its rules cover.
      # Check this suits your retention and access settings.
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: replaydiff-reports
          path: |
            summary.md
            junit.xml
            gate.json
          if-no-files-found: warn
          retention-days: 7
